<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>{{total}}</h1>
    <form action=" {{ url_for('main.search_endpoint') }}  " method="post" >
    <input type="text" name="search">
    <button name="action" value="sell_search" class="btn btn-primary">Buscar</button>
    </form>
    {% for item in results  %}
    <div>
    <form action="{{url_for('main.sell')}}" method="post">
        <input type="hidden" name="item_id" value="{{ item.id }}">
        <button name="action" value="add_to_sell_list" class="btn btn-primary"> Agregar</button>
    <h2>{{ item.name }}</h2>
    </form>
    </div>
    {% endfor %}
    <form action="" method="post">
    <table class="table table-striped table-bordered table-hover">
        <thead>
        <tr>
    <th>Nombre</th>
    <th>Cantidad a vender</th>
    <th>Precio</th>
  </tr>
  </thead>
  <tbody>
    
    {% for item in to_sell%}
    <tr>
    <td>
        <input type="hidden" name="item_id[]" value="{{item.id}}">
    {{item.name}}
    </td>
    <td>
        <button>- </button>
    <input type="text" name="quantities[]">
    <button>+</button>
    </td>
    <td>
    {{item.price}}
    </td>
    </tr>
    {%endfor%}
    <button type="submit" name="action" value="sell" class="btn btn-danger">Calcular</button>
  </tbody>
    </table>
    </form>
</body>
</html>
