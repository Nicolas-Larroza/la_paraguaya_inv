<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Paraguaya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <div class="container mt-4">

    <!-- Top Toolbar -->
    <div class="d-flex gap-2 mb-4 flex-wrap align-items-center">
      <!-- Left buttons -->
      <form action="{{ url_for('main.add') }}" method="get">
        <button class="btn btn-success btn-lg">Añadir</button>
      </form>

      <!-- Right buttons -->
      <div class="ms-auto d-flex gap-2">
        <form action="{{ url_for('main.sell') }}" method="get">
          <button class="btn btn-success btn-lg">Vender</button>
        </form>
        <form action="{{ url_for('main.search_endpoint') }}" method="post">
          <input type="text" name="search">
          <button class="btn btn-primary btn-lg" name="search_action" value="index_search">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </form>
      </div>
    </div>

    <!-- Inventory Table Form -->
    <form action="{{ url_for('main.get_selected') }}" method="post">

      <!-- Edit/Delete Buttons ABOVE the table -->
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-warning btn-lg" name="action" value="edit">Editar</button>
        <button class="btn btn-danger btn-lg"
                name="action" value="delete"
                {% if not items %}disabled{% endif %}>
          Borrar
        </button>
      </div>

      <!-- Inventory Table -->
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody>
          {% for item in items %}
          <tr class="clickable-row">
            <td>
              <input type="checkbox" name="selected[]" value="{{ item.id }}" onclick="event.stopPropagation()">
              {{ item.name }}
            </td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.price }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </form>

  </div>

  <script>
    // Make table rows clickable to toggle checkboxes
    document.querySelectorAll(".clickable-row").forEach(row => {
      row.addEventListener("click", () => {
        const checkbox = row.querySelector("input[type='checkbox']");
        checkbox.checked = !checkbox.checked;
      });
    });
  </script>
</body>
</html>
