<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La paraguaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
<div class="d-flex gap-2 mb-3"> 
  
  <form action="{{ url_for('main.add') }}" method="get">
    <button class="btn btn-success btn-lg" >añadir</button>
  </form>
  


  

  <form action="{{ url_for('main.get_selected') }}" method="post">
    <button class="btn btn-warning btn-lg" name="action" value="edit" >editar</button>
    <button 
    class="btn btn-danger btn-lg"
    name="action"
    value="delete" 
    {% if not items %}disabled{% endif %} 
    formaction="{{ url_for('main.get_selected') }}"
    formmethod="post"
    >borrar
  </button>
  <span class="ms-5">
  <button class="btn btn-success btn-lg"
  formaction="{{ url_for('main.sell') }}"
  formmethod="get"
  >
  Vender
  </button>
  </span>
  
   </div>
  <h2 class="mb-3"> inventario: </h2>
    
    <table class="table table-striped table-bordered table-hover">
        <thead>
        <tr>
    <th>Nombre</th>
    <th>Cantidad</th>
    <th>Precio</th>
  </tr>
  </thead>
  <tbody>
  
    {% for item in items%}
    <tr>
    <td>
      <input type="checkbox" name="selected[]" value={{item.id}}>
    {{item.name}}
    </td>
    <td>
    {{item.quantity}}
    </td>
    <td>
    {{item.price}}
    </td>
    </tr>
    {%endfor%}
  
  </tbody>
    
    </table>
    </form>
    </div>


</body>
</html>
